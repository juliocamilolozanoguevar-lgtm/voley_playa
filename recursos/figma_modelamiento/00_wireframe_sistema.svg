    <rect class="frame" width="390" height="250" rx="8"/>
    <rect class="box" x="20" y="20" width="350" height="34" rx="6"/>
    <rect class="box" x="20" y="82" width="220" height="32" rx="6"/>
    <line class="line" x1="20" y1="130" x2="300" y2="130"/>
    <line class="line" x1="20" y1="158" x2="270" y2="158"/>
