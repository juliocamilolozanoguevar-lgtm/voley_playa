<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <style>
    .bg{fill:#f3f6fb}.frame{fill:#fff;stroke:#b9c7d6;stroke-width:2}.box{fill:#eef3f8;stroke:#9fb0c2;stroke-width:2}.line{stroke:#7f93aa;stroke-width:2}.title{font:700 28px Arial;fill:#18324f}.label{font:600 16px Arial;fill:#344963}.small{font:13px Arial;fill:#60748c}.pill{fill:#dfe8f2;stroke:#9fb0c2;stroke-width:1}
  </style>
  <rect class="bg" width="1800" height="1200"/>
  <text x="60" y="60" class="title">Wireframe UX - Sistema Voley Playa Diloz</text>
  <text x="60" y="90" class="small">Estructura base de ventanas, navegacion y acciones principales.</text>

  <g transform="translate(60,130)">
