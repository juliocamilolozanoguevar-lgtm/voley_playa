    <rect class="pill" x="0" y="20" width="140" height="44" rx="22"/><text x="30" y="48" class="small">Login</text>
    <rect class="pill" x="190" y="20" width="140" height="44" rx="22"/><text x="213" y="48" class="small">Dashboard</text>
    <rect class="pill" x="380" y="20" width="140" height="44" rx="22"/><text x="410" y="48" class="small">Clientes</text>
