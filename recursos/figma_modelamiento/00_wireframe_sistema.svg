    <rect class="box" x="24" y="70" width="220" height="30" rx="4"/>
    <rect class="box" x="276" y="70" width="220" height="30" rx="4"/>
    <rect class="box" x="24" y="116" width="140" height="30" rx="4"/>
    <rect class="box" x="190" y="116" width="140" height="30" rx="4"/>
