<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .bg{fill:#f4f8fc}.node{fill:#fff;stroke:#1f6feb;stroke-width:2}.decision{fill:#fff8dd;stroke:#b7791f;stroke-width:2}.end{fill:#e3f8f1;stroke:#0f9d79;stroke-width:2}.bad{fill:#ffe8ef;stroke:#be123c;stroke-width:2}.title{font:700 30px Arial;fill:#16304d}.txt{font:600 16px Arial;fill:#16304d}.small{font:13px Arial;fill:#5f738c}.arrow{stroke:#5f738c;stroke-width:3;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f738c"/></marker></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="60" class="title">Flujo UX - Reserva y cancelacion</text>
  <text x="60" y="88" class="small">Modelamiento del recorrido operativo implementado en el sistema.</text>

  <rect class="node" x="80" y="160" width="190" height="76" rx="12"/><text x="120" y="193" class="txt">Iniciar sesion</text><text x="120" y="216" class="small">Admin</text>
  <rect class="node" x="340" y="160" width="190" height="76" rx="12"/><text x="383" y="193" class="txt">Dashboard</text><text x="372" y="216" class="small">Resumen y nav</text>
  <rect class="node" x="600" y="160" width="220" height="76" rx="12"/><text x="632" y="193" class="txt">Clientes y reservas</text><text x="638" y="216" class="small">Registro integral</text>
  <rect class="decision" x="900" y="145" width="210" height="105" rx="18"/><text x="943" y="190" class="txt">Cliente existe?</text><text x="940" y="214" class="small">Buscar por DNI</text>
  <rect class="node" x="1190" y="92" width="220" height="76" rx="12"/><text x="1228" y="125" class="txt">Autocompletar</text><text x="1240" y="148" class="small">Datos cliente</text>
  <rect class="node" x="1190" y="230" width="220" height="76" rx="12"/><text x="1248" y="263" class="txt">Registrar</text><text x="1238" y="286" class="small">Nuevo cliente</text>

  <line class="arrow" x1="270" y1="198" x2="340" y2="198"/><line class="arrow" x1="530" y1="198" x2="600" y2="198"/><line class="arrow" x1="820" y1="198" x2="900" y2="198"/>
  <line class="arrow" x1="1110" y1="176" x2="1190" y2="130"/><line class="arrow" x1="1110" y1="220" x2="1190" y2="268"/>

  <rect class="node" x="150" y="420" width="220" height="76" rx="12"/><text x="183" y="453" class="txt">Seleccionar cancha</text><text x="205" y="476" class="small">Arena 1 / Arena 2</text>
  <rect class="node" x="450" y="420" width="220" height="76" rx="12"/><text x="498" y="453" class="txt">Elegir fecha</text><text x="489" y="476" class="small">No fechas pasadas</text>
  <rect class="node" x="750" y="420" width="220" height="76" rx="12"/><text x="792" y="453" class="txt">Ver horarios</text><text x="781" y="476" class="small">Slots de 30 minutos</text>
  <rect class="decision" x="1050" y="405" width="230" height="106" rx="18"/><text x="1092" y="451" class="txt">Hay conflicto?</text><text x="1090" y="475" class="small">Reserva activa misma hora</text>
  <rect class="end" x="1350" y="360" width="190" height="76" rx="12"/><text x="1388" y="393" class="txt">Guardar</text><text x="1378" y="416" class="small">Reserva y pago</text>
  <rect class="bad" x="1350" y="500" width="190" height="76" rx="12"/><text x="1388" y="533" class="txt">Bloquear</text><text x="1378" y="556" class="small">Horario ocupado</text>
  <line class="arrow" x1="370" y1="458" x2="450" y2="458"/><line class="arrow" x1="670" y1="458" x2="750" y2="458"/><line class="arrow" x1="970" y1="458" x2="1050" y2="458"/>
  <line class="arrow" x1="1280" y1="438" x2="1350" y2="398"/><line class="arrow" x1="1280" y1="478" x2="1350" y2="538"/>

  <rect class="node" x="150" y="680" width="220" height="76" rx="12"/><text x="196" y="713" class="txt">Editar reserva</text><text x="190" y="736" class="small">Boton editar</text>
  <rect class="decision" x="450" y="665" width="230" height="106" rx="18"/><text x="482" y="711" class="txt">Estado cancelada?</text><text x="492" y="735" class="small">Cambio en modal</text>
  <rect class="decision" x="760" y="665" width="250" height="106" rx="18"/><text x="795" y="711" class="txt">Antes de la fecha?</text><text x="805" y="735" class="small">Hoy menor a fecha reserva</text>
  <rect class="end" x="1090" y="625" width="230" height="76" rx="12"/><text x="1123" y="658" class="txt">Cancelar y liberar</text><text x="1120" y="681" class="small">Horario disponible</text>
  <rect class="bad" x="1090" y="755" width="230" height="76" rx="12"/><text x="1138" y="788" class="txt">No permitir</text><text x="1122" y="811" class="small">Fecha actual o pasada</text>
  <line class="arrow" x1="370" y1="718" x2="450" y2="718"/><line class="arrow" x1="680" y1="718" x2="760" y2="718"/><line class="arrow" x1="1010" y1="695" x2="1090" y2="663"/><line class="arrow" x1="1010" y1="742" x2="1090" y2="793"/>
</svg>
